name: phase7c2-public-model

on:
  push:
    branches: [rebuild/phase7-public-api]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JAX_PLATFORMS: cpu
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          path: candidate

      - name: Check out pinned legacy reference
        uses: actions/checkout@v4
        with:
          repository: ignaciomagana/darksirens
          ref: c042527238bd71421b792936bc48c3b815b90d6d
          path: legacy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused public-model test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy==1.26.4" \
            "scipy==1.12.0" \
            "jax[cpu]==0.4.34" \
            "h5py==3.12.1" \
            "pytest==8.3.4" \
            "ruff==0.15.20"
          python -m pip install --no-deps -e candidate

      - name: Definite-error lint
        working-directory: candidate
        run: |
          ruff check src/darksirens/analysis.py src/darksirens/__init__.py tests/test_public_model.py tools/probe_public_model_plan.py --select F,E9
          python -m compileall -q src/darksirens/analysis.py src/darksirens/__init__.py tests/test_public_model.py tools/probe_public_model_plan.py

      - name: Verify root model facade stays lazy
        working-directory: candidate
        run: |
          python - <<'PY'
          import sys
          import darksirens as ds

          assert callable(ds.model)
          for name in ("jax", "jax.numpy", "h5py", "numpyro", "dynesty", "tinyns"):
              assert name not in sys.modules, (name, sorted(sys.modules))
          print("Phase 7C2 root model facade is lazy")
          PY

      - name: Focused Phase 7C2 tests
        working-directory: candidate
        run: python -m pytest -q tests/test_public_model.py

      - name: Read frozen ordinary catalog parameter cells
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/candidate/src" python candidate/tools/probe_public_model_plan.py \
            --implementation legacy \
            --legacy-root "$GITHUB_WORKSPACE/legacy" \
            --out /tmp/public-model-legacy.json

      - name: Evaluate reconstructed public ordinary plans
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/candidate/src" python candidate/tools/probe_public_model_plan.py \
            --implementation candidate \
            --out /tmp/public-model-candidate.json

      - name: Require frozen ordinary catalog-block parity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          legacy = json.loads(Path('/tmp/public-model-legacy.json').read_text())
          candidate = json.loads(Path('/tmp/public-model-candidate.json').read_text())
          if legacy != candidate:
              raise SystemExit(
                  "public model ordinary catalog-block parity failure:\n"
                  f"legacy={legacy!r}\n"
                  f"candidate={candidate!r}"
              )
          print("Phase 7C2 ordinary spectral/dark/complete catalog blocks match frozen registry")
          PY
