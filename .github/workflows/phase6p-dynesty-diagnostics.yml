name: phase6p-dynesty-diagnostics

on:
  push:
    branches: [rebuild/phase6-inference-io]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dynesty-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          path: candidate

      - name: Check out pinned legacy reference
        uses: actions/checkout@v4
        with:
          repository: ignaciomagana/darksirens
          ref: c042527238bd71421b792936bc48c3b815b90d6d
          path: legacy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependency-minimal test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.26.4" "pytest==8.3.4" "ruff==0.15.20"
          python -m pip install --no-deps -e candidate

      - name: Definite-error lint
        working-directory: candidate
        run: |
          ruff check src/darksirens/inference/dynesty_diagnostics.py src/darksirens/inference/dynesty_adapter.py tests/test_dynesty_adapter.py tests/test_dynesty_diagnostics.py tests/test_dynesty_diagnostics_integration.py tools/probe_dynesty_diagnostics.py --select F,E9
          python -m compileall -q src/darksirens/inference/dynesty_diagnostics.py src/darksirens/inference/dynesty_adapter.py tests/test_dynesty_adapter.py tests/test_dynesty_diagnostics.py tests/test_dynesty_diagnostics_integration.py tools/probe_dynesty_diagnostics.py

      - name: Verify plotting and sampler dependencies stay lazy
        working-directory: candidate
        run: |
          python - <<'PY'
          import sys
          import darksirens.inference.dynesty_adapter as adapter
          import darksirens.inference.dynesty_diagnostics as diagnostics

          assert callable(adapter.run_dynesty)
          assert callable(diagnostics.start_dynesty_diagnostics)
          assert "jax" not in sys.modules
          assert "dynesty" not in sys.modules
          assert "dynesty.plotting" not in sys.modules
          assert "matplotlib" not in sys.modules
          assert "matplotlib.pyplot" not in sys.modules
          assert "h5py" not in sys.modules
          print("6P imports no JAX, Dynesty, Matplotlib, or HDF5 backend")
          PY

      - name: Focused Phase 6P tests
        working-directory: candidate
        run: |
          python -m pytest -q \
            tests/test_dynesty_adapter.py \
            tests/test_dynesty_diagnostics.py \
            tests/test_dynesty_diagnostics_integration.py

      - name: Evaluate frozen legacy diagnostic behavior
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/legacy" python candidate/tools/probe_dynesty_diagnostics.py \
            --implementation legacy \
            --legacy-root "$GITHUB_WORKSPACE/legacy" \
            --out /tmp/dynesty-diagnostics-legacy.json

      - name: Evaluate reconstructed diagnostic behavior
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/candidate/src" python candidate/tools/probe_dynesty_diagnostics.py \
            --implementation candidate \
            --out /tmp/dynesty-diagnostics-candidate.json

      - name: Require exact Phase 6P parity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          legacy = json.loads(Path('/tmp/dynesty-diagnostics-legacy.json').read_text())
          candidate = json.loads(Path('/tmp/dynesty-diagnostics-candidate.json').read_text())
          if legacy != candidate:
              raise SystemExit(
                  "Dynesty diagnostics parity failure:\n"
                  f"legacy={legacy!r}\n"
                  f"candidate={candidate!r}"
              )
          print("Phase 6P frozen/new Dynesty diagnostic behavior is exact")
          PY
