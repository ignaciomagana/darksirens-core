name: phase6-runtime-guards

on:
  push:
    branches: [rebuild/phase6-inference-io]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JAX_PLATFORMS: cpu
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      DARKSIRENS_ZMAX: "5.0"
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          path: candidate

      - name: Check out pinned legacy reference
        uses: actions/checkout@v4
        with:
          repository: ignaciomagana/darksirens
          ref: c042527238bd71421b792936bc48c3b815b90d6d
          path: legacy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: candidate/pyproject.toml

      - name: Install validated CPU numerics
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "jax[cpu]==0.4.34" "numpy==1.26.4" "scipy==1.12.0" \
            "h5py==3.12.1" "astropy==6.1.4" "pytest==8.3.4" "ruff==0.15.20" \
            "equinox==0.11.10" "tinygp==0.3.0"
          python -m pip install --no-deps -e candidate

      - name: Definite-error lint
        working-directory: candidate
        run: |
          ruff check \
            src/darksirens/inference/preflight.py \
            src/darksirens/inference/run.py \
            tests/test_nested_sampler_preflight.py \
            tests/test_zero_free_parameter_result.py \
            tools/probe_nested_sampler_preflight.py \
            tools/probe_zero_free_parameter_result.py \
            --select F,E9
          python -m compileall -q \
            src/darksirens/inference/preflight.py \
            src/darksirens/inference/run.py \
            tests/test_nested_sampler_preflight.py \
            tests/test_zero_free_parameter_result.py \
            tools/probe_nested_sampler_preflight.py \
            tools/probe_zero_free_parameter_result.py

      - name: Phase 6G nested-sampler preflight tests
        working-directory: candidate
        run: python -m pytest -q tests/test_nested_sampler_preflight.py

      - name: Phase 6H zero-free exact-evidence tests
        working-directory: candidate
        run: python -m pytest -q tests/test_zero_free_parameter_result.py

      - name: Full reconstructed regression suite
        working-directory: candidate
        run: python -m pytest -q

      - name: Verify Phase 6G/6H dependency boundary and light imports
        working-directory: candidate
        run: |
          python - <<'PY'
          import ast
          import sys
          from pathlib import Path

          forbidden = (
              "darksirens.cli",
              "darksirens.surveys", "darksirens_surveys",
              "darksirens.lss", "darksirens_lss",
              "darksirens.lensing", "darksirens_lensing",
              "darksirens.redshift", "darksirens.sky",
              "healpy", "dynesty", "numpyro", "tinyns",
          )
          for rel in (
              "src/darksirens/inference/preflight.py",
              "src/darksirens/inference/run.py",
          ):
              path = Path(rel)
              tree = ast.parse(path.read_text())
              bad = []
              for node in ast.walk(tree):
                  names = []
                  if isinstance(node, ast.Import):
                      names = [a.name for a in node.names]
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      names = [node.module]
                  for name in names:
                      if any(name == x or name.startswith(x + ".") for x in forbidden):
                          bad.append((rel, name))
              assert not bad, bad

          import darksirens.inference.preflight
          import darksirens.inference.run
          light_forbidden = (
              "jax", "jaxlib", "dynesty", "numpyro", "tinyns", "healpy",
              "darksirens.cli", "darksirens.redshift", "darksirens.sky",
              "darksirens.surveys", "darksirens.lss", "darksirens.lensing",
          )
          assert not [name for name in light_forbidden if name in sys.modules]
          print("Phase 6G/6H runtime boundaries and light imports are clean")
          PY

      - name: Evaluate pinned legacy nested-preflight behavior
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/legacy" python candidate/tools/probe_nested_sampler_preflight.py --implementation legacy --out /tmp/preflight-legacy.json

      - name: Evaluate reconstructed nested-preflight behavior
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/candidate/src" python candidate/tools/probe_nested_sampler_preflight.py --implementation candidate --out /tmp/preflight-candidate.json

      - name: Require exact Phase 6G nested-preflight parity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          legacy = json.loads(Path('/tmp/preflight-legacy.json').read_text())['behavior']
          candidate = json.loads(Path('/tmp/preflight-candidate.json').read_text())['behavior']
          if legacy != candidate:
              raise SystemExit(
                  f"nested-preflight parity failure:\nlegacy={legacy!r}\ncandidate={candidate!r}"
              )
          print("Phase 6G legacy/new nested-preflight behavior is exact")
          PY

      - name: Evaluate pinned legacy zero-free behavior
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/legacy" python candidate/tools/probe_zero_free_parameter_result.py --implementation legacy --out /tmp/zero-free-legacy.json

      - name: Evaluate reconstructed zero-free behavior
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/candidate/src" python candidate/tools/probe_zero_free_parameter_result.py --implementation candidate --out /tmp/zero-free-candidate.json

      - name: Require exact Phase 6H zero-free parity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          legacy = json.loads(Path('/tmp/zero-free-legacy.json').read_text())['behavior']
          candidate = json.loads(Path('/tmp/zero-free-candidate.json').read_text())['behavior']
          if legacy != candidate:
              raise SystemExit(
                  f"zero-free parity failure:\nlegacy={legacy!r}\ncandidate={candidate!r}"
              )
          print("Phase 6H legacy/new zero-free behavior is exact")
          PY
