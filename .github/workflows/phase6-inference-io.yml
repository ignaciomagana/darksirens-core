name: phase6-inference-io

on:
  push:
    branches: [rebuild/phase6-inference-io]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inference-io:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      JAX_PLATFORMS: cpu
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      DARKSIRENS_ZMAX: "5.0"
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          path: candidate

      - name: Check out pinned legacy reference
        uses: actions/checkout@v4
        with:
          repository: ignaciomagana/darksirens
          ref: c042527238bd71421b792936bc48c3b815b90d6d
          path: legacy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: candidate/pyproject.toml

      - name: Install validated CPU numerics and GP extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "jax[cpu]==0.4.34" "numpy==1.26.4" "scipy==1.12.0" \
            "h5py==3.12.1" "astropy==6.1.4" "pytest==8.3.4" "ruff==0.15.20" \
            "equinox==0.11.10" "tinygp==0.3.0"
          python -m pip install --no-deps -e candidate

      - name: Definite-error lint
        working-directory: candidate
        run: |
          ruff check src tests tools --select F,E9
          python -m compileall -q src tests tools

      - name: Phase 6A result-artifact tests
        working-directory: candidate
        run: python -m pytest -q tests/test_result_artifact.py

      - name: Phase 6B checkpoint-plan tests
        working-directory: candidate
        run: python -m pytest -q tests/test_checkpoint_plan.py

      - name: Phase 6C1 fingerprint-gate tests
        working-directory: candidate
        run: python -m pytest -q tests/test_run_fingerprint_gate.py

      - name: Phase 6D prior-transform tests
        working-directory: candidate
        run: python -m pytest -q tests/test_prior_transform.py

      - name: Phase 6E dynesty checkpoint-state tests
        working-directory: candidate
        run: python -m pytest -q tests/test_dynesty_checkpoint_state.py

      - name: Phase 6F dynesty transform-dispatch tests
        working-directory: candidate
        run: python -m pytest -q tests/test_dynesty_transform_dispatch.py

      - name: Full reconstructed regression suite
        working-directory: candidate
        run: python -m pytest -q

      - name: Verify Phase 6 portable dependency boundary
        working-directory: candidate
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          forbidden = (
              "jax",
              "jaxlib",
              "darksirens.cli",
              "darksirens.surveys",
              "darksirens_surveys",
              "darksirens.lss",
              "darksirens_lss",
              "darksirens.lensing",
              "darksirens_lensing",
              "darksirens.redshift",
              "darksirens.sky",
              "healpy",
              "dynesty",
              "numpyro",
              "tinyns",
          )
          paths = list(Path("src/darksirens/io").rglob("*.py"))
          paths.extend([
              Path("src/darksirens/inference/__init__.py"),
              Path("src/darksirens/inference/checkpointing.py"),
              Path("src/darksirens/inference/run_fingerprint.py"),
          ])
          bad = []
          for path in paths:
              tree = ast.parse(path.read_text())
              for node in ast.walk(tree):
                  names = []
                  if isinstance(node, ast.Import):
                      names = [a.name for a in node.names]
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      names = [node.module]
                  for name in names:
                      if any(name == x or name.startswith(x + ".") for x in forbidden):
                          bad.append((str(path), name))
          assert not bad, bad

          extension_forbidden = (
              "darksirens.cli",
              "darksirens.surveys",
              "darksirens_surveys",
              "darksirens.lss",
              "darksirens_lss",
              "darksirens.lensing",
              "darksirens_lensing",
              "darksirens.redshift",
              "darksirens.sky",
              "healpy",
              "dynesty",
              "numpyro",
              "tinyns",
          )
          for rel in (
              "src/darksirens/inference/prior.py",
              "src/darksirens/inference/dynesty_transform.py",
          ):
              path = Path(rel)
              tree = ast.parse(path.read_text())
              bad_ext = []
              for node in ast.walk(tree):
                  names = []
                  if isinstance(node, ast.Import):
                      names = [a.name for a in node.names]
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      names = [node.module]
                  for name in names:
                      if any(name == x or name.startswith(x + ".") for x in extension_forbidden):
                          bad_ext.append((str(path), name))
              assert not bad_ext, bad_ext

          checkpoint_forbidden = tuple(
              x for x in extension_forbidden if x != "dynesty"
          )
          adapter_path = Path("src/darksirens/inference/dynesty_checkpoint.py")
          adapter = ast.parse(adapter_path.read_text())
          bad_adapter = []
          for node in ast.walk(adapter):
              names = []
              if isinstance(node, ast.Import):
                  names = [a.name for a in node.names]
              elif isinstance(node, ast.ImportFrom) and node.module:
                  names = [node.module]
              for name in names:
                  if any(name == x or name.startswith(x + ".") for x in checkpoint_forbidden):
                      bad_adapter.append((str(adapter_path), name))
          assert not bad_adapter, bad_adapter

          top_level_dynesty = []
          for node in adapter.body:
              if isinstance(node, ast.Import):
                  names = [a.name for a in node.names]
              elif isinstance(node, ast.ImportFrom) and node.module:
                  names = [node.module]
              else:
                  names = []
              if any(name == "dynesty" or name.startswith("dynesty.") for name in names):
                  top_level_dynesty.extend(names)
          assert not top_level_dynesty, top_level_dynesty
          print("portable inference/IO boundaries and lazy dynesty imports are clean")
          PY
          python - <<'PY'
          import sys
          import darksirens.io.results
          import darksirens.inference.checkpointing
          import darksirens.inference.run_fingerprint
          import darksirens.inference.dynesty_checkpoint
          from darksirens.inference.prior import make_prior_transform
          make_prior_transform([0.0], [1.0])
          bad = (
              "jax", "jaxlib", "dynesty", "numpyro", "tinyns", "healpy",
              "darksirens.cli", "darksirens.redshift", "darksirens.sky",
              "darksirens.surveys", "darksirens.lss", "darksirens.lensing",
          )
          assert not [name for name in bad if name in sys.modules]
          print("Phase 6 light imports plus uniform prior construction load no runtime/backend/plugin")
          PY

      - name: Evaluate pinned legacy result-artifact behavior
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/legacy" python candidate/tools/probe_result_artifact.py --implementation legacy --out /tmp/result-artifact-legacy.json
      - name: Evaluate reconstructed result-artifact behavior
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/candidate/src" python candidate/tools/probe_result_artifact.py --implementation candidate --out /tmp/result-artifact-candidate.json
      - name: Require exact Phase 6A result-artifact parity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          legacy = json.loads(Path('/tmp/result-artifact-legacy.json').read_text())['behavior']
          candidate = json.loads(Path('/tmp/result-artifact-candidate.json').read_text())['behavior']
          if legacy != candidate: raise SystemExit(f"result-artifact parity failure:\nlegacy={legacy!r}\ncandidate={candidate!r}")
          print("Phase 6A legacy/new result-artifact behavior is exact")
          PY

      - name: Evaluate pinned legacy checkpoint-plan behavior
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/legacy" python candidate/tools/probe_checkpoint_plan.py --implementation legacy --out /tmp/checkpoint-plan-legacy.json
      - name: Evaluate reconstructed checkpoint-plan behavior
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/candidate/src" python candidate/tools/probe_checkpoint_plan.py --implementation candidate --out /tmp/checkpoint-plan-candidate.json
      - name: Require exact Phase 6B checkpoint-plan parity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          legacy = json.loads(Path('/tmp/checkpoint-plan-legacy.json').read_text())['behavior']
          candidate = json.loads(Path('/tmp/checkpoint-plan-candidate.json').read_text())['behavior']
          if legacy != candidate: raise SystemExit(f"checkpoint-plan parity failure:\nlegacy={legacy!r}\ncandidate={candidate!r}")
          print("Phase 6B legacy/new checkpoint-plan behavior is exact")
          PY

      - name: Evaluate pinned legacy fingerprint-gate behavior
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/legacy" python candidate/tools/probe_run_fingerprint_gate.py --implementation legacy --out /tmp/fingerprint-gate-legacy.json
      - name: Evaluate reconstructed fingerprint-gate behavior
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/candidate/src" python candidate/tools/probe_run_fingerprint_gate.py --implementation candidate --out /tmp/fingerprint-gate-candidate.json
      - name: Require exact Phase 6C1 fingerprint-gate parity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          legacy = json.loads(Path('/tmp/fingerprint-gate-legacy.json').read_text())['behavior']
          candidate = json.loads(Path('/tmp/fingerprint-gate-candidate.json').read_text())['behavior']
          # Documented post-freeze difference: core hashes semantic values
          # canonically (exact array values, not their printed form), so the
          # fingerprint schema moved from 3 to 4 and the schema-mismatch line
          # says why. Check exactly that delta, normalise it away, then require
          # every other probe key (plain-JSON digests included) to be exact.
          LEGACY_SCHEMA, CANDIDATE_SCHEMA = 3, 4
          legacy_line = f"- fingerprint schema_version: {LEGACY_SCHEMA - 1} vs {LEGACY_SCHEMA}\n"
          candidate_line = (
              f"- fingerprint schema_version: {CANDIDATE_SCHEMA - 1} (checkpointed run) "
              f"vs {CANDIDATE_SCHEMA} (this run); the checkpoint was fingerprinted under "
              "a different schema (schema 3 and earlier hashed array values at print "
              "precision), so its digest cannot be compared with this run's\n"
          )
          def swap(text, line, side):
              if text.count(line) != 1: raise SystemExit(f"fingerprint-gate schema delta: {side} text lacks {line!r}:\n{text!r}")
              return text.replace(line, "<SCHEMA-MISMATCH-LINE>\n")
          for side, behavior, schema, line in (("legacy", legacy, LEGACY_SCHEMA, legacy_line), ("candidate", candidate, CANDIDATE_SCHEMA, candidate_line)):
              if behavior['constants']['schema'] != schema: raise SystemExit(f"fingerprint-gate schema delta: {side} schema {behavior['constants']['schema']!r} != {schema}")
              if behavior['schema_force']['returned_schema'] != schema - 1: raise SystemExit(f"fingerprint-gate schema delta: {side} forced resume returned schema {behavior['schema_force']['returned_schema']!r} != {schema - 1}")
              behavior['constants']['schema'] = '<SCHEMA>'
              behavior['schema_force']['returned_schema'] = '<SCHEMA-1>'
              behavior['schema_error'][1] = swap(behavior['schema_error'][1], line, side)
              for warning in behavior['schema_force']['warnings']: warning[1] = swap(warning[1], line, side)
          if legacy != candidate: raise SystemExit(f"fingerprint-gate parity failure:\nlegacy={legacy!r}\ncandidate={candidate!r}")
          print("Phase 6C1 legacy/new fingerprint-gate behavior is exact apart from the documented schema 3 -> 4 bump")
          PY

      - name: Evaluate pinned legacy prior-transform behavior
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/legacy" python candidate/tools/probe_prior_transform.py --implementation legacy --out /tmp/prior-transform-legacy.json
      - name: Evaluate reconstructed prior-transform behavior
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/candidate/src" python candidate/tools/probe_prior_transform.py --implementation candidate --out /tmp/prior-transform-candidate.json
      - name: Require exact Phase 6D prior-transform parity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          legacy = json.loads(Path('/tmp/prior-transform-legacy.json').read_text())['behavior']
          candidate = json.loads(Path('/tmp/prior-transform-candidate.json').read_text())['behavior']
          if legacy != candidate: raise SystemExit(f"prior-transform parity failure:\nlegacy={legacy!r}\ncandidate={candidate!r}")
          print("Phase 6D legacy/new prior-transform behavior is bit-exact")
          PY

      - name: Evaluate pinned legacy dynesty checkpoint-state behavior
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/legacy" python candidate/tools/probe_dynesty_checkpoint_state.py --implementation legacy --out /tmp/dynesty-checkpoint-legacy.json
      - name: Evaluate reconstructed dynesty checkpoint-state behavior
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/candidate/src" python candidate/tools/probe_dynesty_checkpoint_state.py --implementation candidate --out /tmp/dynesty-checkpoint-candidate.json
      - name: Require exact Phase 6E dynesty checkpoint-state parity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          legacy = json.loads(Path('/tmp/dynesty-checkpoint-legacy.json').read_text())['behavior']
          candidate = json.loads(Path('/tmp/dynesty-checkpoint-candidate.json').read_text())['behavior']
          if legacy != candidate: raise SystemExit(f"dynesty checkpoint-state parity failure:\nlegacy={legacy!r}\ncandidate={candidate!r}")
          print("Phase 6E legacy/new dynesty checkpoint-state behavior is exact")
          PY

      - name: Evaluate pinned legacy dynesty transform-dispatch behavior
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/legacy" python candidate/tools/probe_dynesty_transform_dispatch.py --implementation legacy --out /tmp/dynesty-transform-legacy.json
      - name: Evaluate reconstructed dynesty transform-dispatch behavior
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/candidate/src" python candidate/tools/probe_dynesty_transform_dispatch.py --implementation candidate --out /tmp/dynesty-transform-candidate.json
      - name: Require exact Phase 6F dynesty transform-dispatch parity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          legacy = json.loads(Path('/tmp/dynesty-transform-legacy.json').read_text())['behavior']
          candidate = json.loads(Path('/tmp/dynesty-transform-candidate.json').read_text())['behavior']
          if legacy != candidate: raise SystemExit(f"dynesty transform-dispatch parity failure:\nlegacy={legacy!r}\ncandidate={candidate!r}")
          print("Phase 6F legacy/new dynesty transform-dispatch behavior is exact")
          PY

      - name: Install pinned legacy parity dependencies
        run: |
          python -m pip install \
            "matplotlib==3.9.2" "healpy==1.17.3" "tqdm==4.66.5" \
            "dynesty==2.1.4" "seaborn==0.12.2" "numpyro==0.17.0"

      - name: Evaluate pinned legacy Phase 5 fixtures
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/legacy" python candidate/tools/probe_catalog_kernel.py --implementation legacy --out /tmp/catalog-legacy.json
          PYTHONPATH="$GITHUB_WORKSPACE/legacy" python candidate/tools/probe_catalog_completeness.py --implementation legacy --out /tmp/completeness-legacy.json
          PYTHONPATH="$GITHUB_WORKSPACE/legacy" python candidate/tools/probe_catalog_likelihood.py --implementation legacy --out /tmp/likelihood-legacy.json
          PYTHONPATH="$GITHUB_WORKSPACE/legacy" python candidate/tools/probe_catalog_marks.py --implementation legacy --out /tmp/marks-legacy.json
          PYTHONPATH="$GITHUB_WORKSPACE/legacy" python candidate/tools/probe_catalog_selection.py --implementation legacy --out /tmp/selection-legacy.json

      - name: Evaluate reconstructed Phase 5 fixtures
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/candidate/src" python candidate/tools/probe_catalog_kernel.py --implementation candidate --out /tmp/catalog-candidate.json
          PYTHONPATH="$GITHUB_WORKSPACE/candidate/src" python candidate/tools/probe_catalog_completeness.py --implementation candidate --out /tmp/completeness-candidate.json
          PYTHONPATH="$GITHUB_WORKSPACE/candidate/src" python candidate/tools/probe_catalog_likelihood.py --implementation candidate --out /tmp/likelihood-candidate.json
          PYTHONPATH="$GITHUB_WORKSPACE/candidate/src" python candidate/tools/probe_catalog_marks.py --implementation candidate --out /tmp/marks-candidate.json
          PYTHONPATH="$GITHUB_WORKSPACE/candidate/src" python candidate/tools/probe_catalog_selection.py --implementation candidate --out /tmp/selection-candidate.json

      - name: Require preserved Phase 5 parity
        run: |
          python candidate/tools/compare_catalog_kernel_probe.py /tmp/catalog-legacy.json /tmp/catalog-candidate.json --rtol 1e-12
          python candidate/tools/compare_catalog_completeness_probe.py /tmp/completeness-legacy.json /tmp/completeness-candidate.json --rtol 1e-12
          python candidate/tools/compare_catalog_likelihood_probe.py /tmp/likelihood-legacy.json /tmp/likelihood-candidate.json --golden candidate/tests/reference/legacy/unified_k1_golden.json --rtol 1e-12
          python candidate/tools/compare_catalog_likelihood_probe.py /tmp/marks-legacy.json /tmp/marks-candidate.json --golden candidate/tests/reference/legacy/unified_k1_golden.json --rtol 1e-12
          python candidate/tools/compare_catalog_completeness_probe.py /tmp/selection-legacy.json /tmp/selection-candidate.json --rtol 1e-12
