name: phase3-extra-tests-bootstrap

on:
  push:
    branches: [rebuild/phase3-population]

permissions:
  contents: write

jobs:
  bootstrap-extra-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          token: ${{ github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ignaciomagana/darksirens
          ref: c042527238bd71421b792936bc48c3b815b90d6d
          path: legacy
      - name: Copy support tests once
        run: |
          set -euo pipefail
          cd candidate
          if test -f .phase3_extra_tests_bootstrapped; then exit 0; fi
          for f in test_pairing_norm_grid.py test_population_support_contracts.py; do
            cp "../legacy/tests/$f" "tests/$f"
          done
          python - <<'PY'
          from pathlib import Path
          for name in ('test_pairing_norm_grid.py','test_population_support_contracts.py'):
              p = Path('tests') / name
              t = p.read_text().replace('darksirens.gw.populations', 'darksirens.population')
              t = t.replace('darksirens.redshift.grid', 'darksirens.cosmology._grid')
              p.write_text(t)
          PY
          touch .phase3_extra_tests_bootstrapped
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests .phase3_extra_tests_bootstrapped
          git commit -m 'Import population support validation assets'
          git push origin HEAD:rebuild/phase3-population
