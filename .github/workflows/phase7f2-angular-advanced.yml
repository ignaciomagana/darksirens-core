name: phase7f2-angular-advanced

on:
  push:
    branches: [rebuild/phase7-public-api]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  angular-advanced:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: "True"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      DARKSIRENS_ZMAX: "5.0"
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          path: candidate

      - name: Check out pinned legacy reference
        uses: actions/checkout@v4
        with:
          repository: ignaciomagana/darksirens
          ref: c042527238bd71421b792936bc48c3b815b90d6d
          path: legacy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused advanced-angular tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "jax[cpu]==0.4.34" \
            "numpy==1.26.4" \
            "scipy==1.12.0" \
            "astropy==6.1.4" \
            "pytest==8.3.4" \
            "ruff==0.15.20"
          python -m pip install --no-deps -e candidate

      - name: Definite-error lint
        working-directory: candidate
        run: |
          ruff check src/darksirens/population/angular.py src/darksirens/population/angular_advanced.py tests/test_angular_basic.py tests/test_angular_advanced.py tools/probe_angular_advanced.py --select F,E9
          python -m compileall -q src/darksirens/population/angular.py src/darksirens/population/angular_advanced.py tests/test_angular_basic.py tests/test_angular_advanced.py tools/probe_angular_advanced.py

      - name: Verify advanced angular runtime has no healpy dependency
        working-directory: candidate
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          imported = []
          for path in (
              Path("src/darksirens/population/angular.py"),
              Path("src/darksirens/population/angular_advanced.py"),
          ):
              tree = ast.parse(path.read_text())
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      imported.extend(alias.name for alias in node.names)
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      imported.append(node.module)
          assert not any(name == "healpy" or name.startswith("healpy.") for name in imported), imported
          print("advanced angular runtime contains no healpy import")
          PY

      - name: Focused Phase 7F2 tests
        working-directory: candidate
        run: python -m pytest -q tests/test_angular_basic.py tests/test_angular_advanced.py

      - name: Evaluate pinned legacy advanced angular models
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/legacy" \
            python candidate/tools/probe_angular_advanced.py \
              --mode legacy --out /tmp/angular-advanced-legacy.json

      - name: Evaluate reconstructed advanced angular models
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/candidate/src" \
            python candidate/tools/probe_angular_advanced.py \
              --mode candidate --out /tmp/angular-advanced-candidate.json

      - name: Require exact advanced angular parity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          legacy = json.loads(Path('/tmp/angular-advanced-legacy.json').read_text())
          candidate = json.loads(Path('/tmp/angular-advanced-candidate.json').read_text())
          assert candidate == legacy, (legacy, candidate)
          print('Phase 7F2 advanced angular parity is exact')
          PY

      - name: Show parity records
        if: always()
        run: |
          cat /tmp/angular-advanced-legacy.json || true
          cat /tmp/angular-advanced-candidate.json || true
