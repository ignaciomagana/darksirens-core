name: phase3-bootstrap

on:
  push:
    branches: [rebuild/phase3-population]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          path: candidate
          token: ${{ github.token }}

      - name: Check out pinned legacy
        uses: actions/checkout@v4
        with:
          repository: ignaciomagana/darksirens
          ref: c042527238bd71421b792936bc48c3b815b90d6d
          path: legacy

      - name: Copy population sources once
        run: |
          set -euo pipefail
          cd candidate
          if test -f .phase3_bootstrapped; then
            echo 'Phase 3 population sources already bootstrapped.'
            exit 0
          fi
          mkdir -p src/darksirens/population
          for f in __init__.py base.py component_spin.py components.py gp.py grammar.py parametric.py registry.py utils.py; do
            cp "../legacy/darksirens/gw/populations/$f" "src/darksirens/population/$f"
          done
          python - <<'PY'
          from pathlib import Path
          root = Path('src/darksirens/population')
          for path in root.glob('*.py'):
              text = path.read_text()
              text = text.replace('darksirens.gw.populations', 'darksirens.population')
              path.write_text(text)
          PY
          python - <<'PY' > phase3_population_dependency_report.txt
          import ast
          from pathlib import Path
          root = Path('src/darksirens/population')
          for path in sorted(root.glob('*.py')):
              tree = ast.parse(path.read_text())
              print(f'## {path.name}')
              for node in ast.walk(tree):
                  if isinstance(node, ast.ImportFrom):
                      print('FROM', node.module, 'IMPORT', ','.join(a.name for a in node.names))
                  elif isinstance(node, ast.Import):
                      print('IMPORT', ','.join(a.name for a in node.names))
              print()
          PY
          touch .phase3_bootstrapped
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/darksirens/population phase3_population_dependency_report.txt .phase3_bootstrapped
          git commit -m 'Import pinned legacy population sources for Phase 3'
          git push origin HEAD:rebuild/phase3-population
