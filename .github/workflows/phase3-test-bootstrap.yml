name: phase3-test-bootstrap

on:
  push:
    branches: [rebuild/phase3-population]

permissions:
  contents: write

jobs:
  bootstrap-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          token: ${{ github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ignaciomagana/darksirens
          ref: c042527238bd71421b792936bc48c3b815b90d6d
          path: legacy
      - name: Copy population validation assets once
        run: |
          set -euo pipefail
          cd candidate
          if test -f .phase3_tests_bootstrapped; then exit 0; fi
          mkdir -p tests/data
          for f in test_population_registry_golden.py test_population_grammar.py test_component_spin_model.py test_gp_q_normalization.py test_gppop_population.py test_pop_gradient_nan_safety.py; do
            cp "../legacy/tests/$f" "tests/$f"
          done
          cp ../legacy/tests/data/population_registry_golden.json tests/data/population_registry_golden.json
          python - <<'PY'
          from pathlib import Path
          for path in Path('tests').glob('test_*population*.py'):
              text = path.read_text().replace('darksirens.gw.populations', 'darksirens.population')
              text = text.replace('darksirens.redshift.grid', 'darksirens.cosmology._grid')
              path.write_text(text)
          for name in ('test_population_registry_golden.py','test_population_grammar.py','test_component_spin_model.py','test_gp_q_normalization.py','test_gppop_population.py','test_pop_gradient_nan_safety.py'):
              path = Path('tests') / name
              text = path.read_text().replace('darksirens.gw.populations', 'darksirens.population')
              text = text.replace('darksirens.redshift.grid', 'darksirens.cosmology._grid')
              path.write_text(text)
          PY
          touch .phase3_tests_bootstrapped
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests .phase3_tests_bootstrapped
          git commit -m 'Import pinned population validation assets'
          git push origin HEAD:rebuild/phase3-population
