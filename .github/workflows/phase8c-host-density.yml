name: phase8c-host-density

on:
  push:
    branches: [rebuild/phase8-core-freeze]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-density:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      JAX_PLATFORMS: cpu
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      DARKSIRENS_ZMAX: "5.0"
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install validated CPU numerics and focused tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "jax[cpu]==0.4.34" "numpy==1.26.4" "scipy==1.12.0" \
            "h5py==3.12.1" "pytest==8.3.4" "ruff==0.15.20" \
            "equinox==0.11.10" "tinygp==0.3.0"
          python -m pip install --no-deps -e .

      - name: Definite-error lint
        run: |
          ruff check \
            src/darksirens/inference/target.py \
            src/darksirens/likelihood/host_density.py \
            src/darksirens/likelihood/__init__.py \
            tests/test_host_density_extension.py \
            --select F,E9
          python -m compileall -q src tests

      - name: Focused Phase 8C tests
        run: python -m pytest -q tests/test_host_density_extension.py

      - name: Verify extension dependency boundary
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          forbidden = (
              "darksirens_surveys",
              "darksirens_lss",
              "darksirens_lensing",
              "darksirens.surveys",
              "darksirens.lss",
              "darksirens.lensing",
          )
          bad = []
          for path in (
              Path("src/darksirens/likelihood/host_density.py"),
              Path("src/darksirens/inference/target.py"),
          ):
              tree = ast.parse(path.read_text())
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [a.name for a in node.names]
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      names = [node.module]
                  else:
                      continue
                  for name in names:
                      if any(name == x or name.startswith(x + ".") for x in forbidden):
                          bad.append((str(path), name))
          assert not bad, bad
          print("host-density seam imports no companion package")
          PY
