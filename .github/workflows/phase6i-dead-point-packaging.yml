name: phase6i-dead-point-packaging

on:
  push:
    branches: [rebuild/phase6-inference-io]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dead-point-packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JAX_PLATFORMS: cpu
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          path: candidate

      - name: Check out pinned legacy reference
        uses: actions/checkout@v4
        with:
          repository: ignaciomagana/darksirens
          ref: c042527238bd71421b792936bc48c3b815b90d6d
          path: legacy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal candidate plus legacy-import dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy==1.26.4" "pytest==8.3.4" "ruff==0.15.20" \
            "jax[cpu]==0.4.34"
          python -m pip install --no-deps -e candidate

      - name: Definite-error lint
        working-directory: candidate
        run: |
          ruff check src/darksirens/inference/nested_output.py tests/test_nested_output.py tools/probe_dead_point_block.py --select F,E9
          python -m compileall -q src/darksirens/inference/nested_output.py tests/test_nested_output.py tools/probe_dead_point_block.py

      - name: Focused Phase 6I tests
        working-directory: candidate
        run: python -m pytest -q tests/test_nested_output.py

      - name: Verify portable dependency and light import
        working-directory: candidate
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("src/darksirens/inference/nested_output.py")
          tree = ast.parse(path.read_text())
          allowed = {"__future__", "numpy"}
          imports = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imports.update(a.name.split(".")[0] for a in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  imports.add(node.module.split(".")[0])
          assert imports <= allowed, imports
          print("6I source depends only on NumPy")
          PY
          python - <<'PY'
          import sys
          from darksirens.inference.nested_output import package_dead_points
          assert callable(package_dead_points)
          forbidden = ("jax", "jaxlib", "dynesty", "numpyro", "tinyns", "healpy")
          assert not [name for name in forbidden if name in sys.modules]
          print("6I import loads no sampler/JAX/HEALPix backend")
          PY

      - name: Evaluate pinned legacy dead-point behavior
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/legacy" python candidate/tools/probe_dead_point_block.py --implementation legacy --out /tmp/dead-legacy.json

      - name: Evaluate reconstructed dead-point behavior
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/candidate/src" python candidate/tools/probe_dead_point_block.py --implementation candidate --out /tmp/dead-candidate.json

      - name: Require exact Phase 6I parity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          legacy = json.loads(Path('/tmp/dead-legacy.json').read_text())['behavior']
          candidate = json.loads(Path('/tmp/dead-candidate.json').read_text())['behavior']
          if legacy != candidate:
              raise SystemExit(
                  "dead-point packaging parity failure:\n"
                  f"legacy={legacy!r}\n"
                  f"candidate={candidate!r}"
              )
          print("Phase 6I legacy/new dead-point packaging behavior is exact")
          PY
