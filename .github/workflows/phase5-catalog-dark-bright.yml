name: phase5-catalog-dark-bright

on:
  push:
    branches: [rebuild/phase5-catalog-dark-bright]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-dark-bright:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      JAX_PLATFORMS: cpu
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      DARKSIRENS_ZMAX: "5.0"
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          path: candidate

      - name: Check out pinned legacy reference
        uses: actions/checkout@v4
        with:
          repository: ignaciomagana/darksirens
          ref: c042527238bd71421b792936bc48c3b815b90d6d
          path: legacy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: candidate/pyproject.toml

      - name: Install validated CPU numerics and GP extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "jax[cpu]==0.4.34" "numpy==1.26.4" "scipy==1.12.0" \
            "h5py==3.12.1" "astropy==6.1.4" "pytest==8.3.4" "ruff==0.15.20" \
            "equinox==0.11.10" "tinygp==0.3.0"
          python -m pip install --no-deps -e candidate

      - name: Definite-error lint
        working-directory: candidate
        run: |
          ruff check src tests tools --select F,E9
          python -m compileall -q src tests tools

      - name: Phase 5A standardized catalog tests
        working-directory: candidate
        run: python -m pytest -q tests/test_catalog_compact.py

      - name: Phase 5A redshift-kernel tests
        working-directory: candidate
        run: |
          python -m pytest -q \
            tests/test_catalog_redshift_kernel.py \
            tests/test_catalog_distance_table.py

      - name: Phase 5B ordinary completeness tests
        working-directory: candidate
        run: |
          python -m pytest -q \
            tests/test_catalog_completeness.py \
            tests/test_catalog_completeness_hlo.py

      - name: Phase 5C explicit hierarchy tests
        working-directory: candidate
        run: python -m pytest -q tests/test_catalog_hierarchical.py

      - name: Phase 5D1 marked-host tests
        working-directory: candidate
        run: python -m pytest -q tests/test_catalog_hosts.py

      - name: Full reconstructed regression suite
        working-directory: candidate
        run: python -m pytest -q

      - name: Verify catalog dependency boundary and light import
        working-directory: candidate
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          forbidden = (
              "darksirens.lss",
              "darksirens_lss",
              "darksirens.lensing",
              "darksirens_lensing",
              "darksirens.surveys",
              "darksirens_surveys",
              "darksirens.cli",
              "healpy",
          )
          bad = []
          for path in Path("src/darksirens/catalog").rglob("*.py"):
              tree = ast.parse(path.read_text())
              for node in ast.walk(tree):
                  names = []
                  if isinstance(node, ast.Import):
                      names = [a.name for a in node.names]
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      names = [node.module]
                  for name in names:
                      if any(name == x or name.startswith(x + ".") for x in forbidden):
                          bad.append((str(path), name))
          assert not bad, bad
          print("catalog runtime has no survey/LSS/lensing/CLI/HEALPix dependency")
          PY
          python - <<'PY'
          import sys
          import darksirens.catalog
          assert "jax" not in sys.modules
          assert "darksirens.cosmology.distances" not in sys.modules
          assert "darksirens.catalog.completeness" not in sys.modules
          print("light catalog import leaves JAX, cosmology tables, and completeness tables unloaded")
          PY

      - name: Install pinned legacy parity dependencies
        run: |
          python -m pip install \
            "matplotlib==3.9.2" "healpy==1.17.3" "tqdm==4.66.5" \
            "dynesty==2.1.4" "seaborn==0.12.2" "numpyro==0.17.0"

      - name: Evaluate pinned legacy catalog fixture in separate process
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/legacy" \
            python candidate/tools/probe_catalog_kernel.py \
            --implementation legacy --out /tmp/catalog-legacy.json

      - name: Evaluate reconstructed catalog fixture in separate process
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/candidate/src" \
            python candidate/tools/probe_catalog_kernel.py \
            --implementation candidate --out /tmp/catalog-candidate.json

      - name: Require legacy/new catalog-kernel parity
        run: |
          python candidate/tools/compare_catalog_kernel_probe.py \
            /tmp/catalog-legacy.json /tmp/catalog-candidate.json --rtol 1e-12

      - name: Evaluate pinned legacy completeness fixture in separate process
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/legacy" \
            python candidate/tools/probe_catalog_completeness.py \
            --implementation legacy --out /tmp/completeness-legacy.json

      - name: Evaluate reconstructed completeness fixture in separate process
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/candidate/src" \
            python candidate/tools/probe_catalog_completeness.py \
            --implementation candidate --out /tmp/completeness-candidate.json

      - name: Require legacy/new ordinary-completeness parity
        run: |
          python candidate/tools/compare_catalog_completeness_probe.py \
            /tmp/completeness-legacy.json /tmp/completeness-candidate.json --rtol 1e-12

      - name: Evaluate pinned legacy ordinary-siren likelihood fixture
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/legacy" \
            python candidate/tools/probe_catalog_likelihood.py \
            --implementation legacy --out /tmp/likelihood-legacy.json

      - name: Evaluate reconstructed ordinary-siren likelihood fixture
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/candidate/src" \
            python candidate/tools/probe_catalog_likelihood.py \
            --implementation candidate --out /tmp/likelihood-candidate.json

      - name: Require Phase 5C legacy/new likelihood parity
        run: |
          python candidate/tools/compare_catalog_likelihood_probe.py \
            /tmp/likelihood-legacy.json /tmp/likelihood-candidate.json \
            --golden candidate/tests/reference/legacy/unified_k1_golden.json \
            --rtol 1e-12

      - name: Evaluate pinned legacy marked-host fixture
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/legacy" \
            python candidate/tools/probe_catalog_marks.py \
            --implementation legacy --out /tmp/marks-legacy.json

      - name: Evaluate reconstructed marked-host fixture
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/candidate/src" \
            python candidate/tools/probe_catalog_marks.py \
            --implementation candidate --out /tmp/marks-candidate.json

      - name: Require Phase 5D1 marked-host parity
        run: |
          python candidate/tools/compare_catalog_likelihood_probe.py \
            /tmp/marks-legacy.json /tmp/marks-candidate.json \
            --golden candidate/tests/reference/legacy/unified_k1_golden.json \
            --rtol 1e-12
