name: phase7d-runtime-binding

on:
  push:
    branches: [rebuild/phase7-public-api]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAX_PLATFORMS: cpu
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      DARKSIRENS_ZMAX: "5.0"
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install validated CPU numerics and focused tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "jax[cpu]==0.4.34" "numpy==1.26.4" "scipy==1.12.0" \
            "h5py==3.12.1" "astropy==6.1.4" "pytest==8.3.4" "ruff==0.15.20" \
            "equinox==0.11.10" "tinygp==0.3.0"
          python -m pip install --no-deps -e .

      - name: Definite-error lint
        run: |
          ruff check src/darksirens/runtime_binding.py tests/test_runtime_binding.py --select F,E9
          python -m compileall -q src/darksirens/runtime_binding.py tests/test_runtime_binding.py

      - name: Verify binding remains sampler- and companion-free
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("src/darksirens/runtime_binding.py")
          tree = ast.parse(path.read_text())
          forbidden = (
              "darksirens.inference.sampling",
              "dynesty",
              "tinyns",
              "numpyro",
              "healpy",
              "darksirens_surveys",
              "darksirens_lss",
              "darksirens_lensing",
              "darksirens.surveys",
              "darksirens.lss",
              "darksirens.lensing",
          )
          found = []
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  names = [a.name for a in node.names]
              elif isinstance(node, ast.ImportFrom) and node.module:
                  names = [node.module]
              else:
                  continue
              for name in names:
                  if any(name == item or name.startswith(item + ".") for item in forbidden):
                      found.append(name)
          assert not found, found
          print("Phase 7D binder has no sampler/healpy/companion imports")
          PY

      - name: Exact fixed-theta binding tests
        run: python -m pytest -q tests/test_runtime_binding.py
