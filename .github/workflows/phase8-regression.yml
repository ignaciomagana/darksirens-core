name: phase8-regression

on:
  push:
    branches: [rebuild/phase8-core-freeze]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JAX_PLATFORMS: cpu
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      DARKSIRENS_ZMAX: "5.0"
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install validated CPU numerics and test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "jax[cpu]==0.4.34" "numpy==1.26.4" "scipy==1.12.0" \
            "h5py==3.12.1" "astropy==6.1.4" "pytest==8.3.4" "ruff==0.15.20" \
            "equinox==0.11.10" "tinygp==0.3.0" \
            "dynesty==2.1.4" "numpyro==0.17.0" "matplotlib==3.9.2" "healpy==1.17.3" \
            "tinyns @ git+https://github.com/ignaciomagana/tinyns.git@3f9e1b2537f32b59f17ee9ce68b2d725681a024c"
          python -m pip install --no-deps -e .

      - name: Definite-error lint
        run: |
          ruff check src tests tools --select F,E9
          python -m compileall -q src tests tools

      - name: Full reconstructed regression suite
        run: python -m pytest -q

      - name: Verify core never imports companion packages
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          forbidden = (
              "darksirens_surveys",
              "darksirens_lss",
              "darksirens_lensing",
              "darksirens.surveys",
              "darksirens.lss",
              "darksirens.lensing",
          )
          bad = []
          for path in Path("src/darksirens").rglob("*.py"):
              tree = ast.parse(path.read_text())
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [a.name for a in node.names]
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      names = [node.module]
                  else:
                      continue
                  for name in names:
                      if any(name == x or name.startswith(x + ".") for x in forbidden):
                          bad.append((str(path), name))
          assert not bad, bad
          print("Phase 8 core has no companion-package imports")
          PY
