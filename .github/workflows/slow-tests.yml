name: slow-tests

# Tests marked `slow` (long end-to-end checks, e.g. the multi-catalog mixture)
# are deselected by pyproject's addopts in every other job and run only here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      JAX_PLATFORMS: cpu
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      DARKSIRENS_ZMAX: "5.0"
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install validated CPU numerics and GP extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "jax[cpu]==0.4.34" "numpy==1.26.4" "scipy==1.12.0" \
            "h5py==3.12.1" "astropy==6.1.4" "pytest==8.3.4" \
            "equinox==0.11.10" "tinygp==0.3.0"
          python -m pip install --no-deps -e .

      - name: Slow tests
        run: |
          set -o pipefail
          python -m pytest -q -m slow 2>&1 | tee /tmp/slow.log

      - name: Refuse an empty slow-test run
        run: |
          if grep -q "no tests ran" /tmp/slow.log; then
            echo "no test is marked slow: the marker or the deselection is broken"
            exit 1
          fi
