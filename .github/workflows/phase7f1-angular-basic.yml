name: phase7f1-angular-basic

on:
  push:
    branches: [rebuild/phase7-public-api]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  angular-basic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: "True"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      DARKSIRENS_ZMAX: "5.0"
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          path: candidate

      - name: Check out pinned legacy reference
        uses: actions/checkout@v4
        with:
          repository: ignaciomagana/darksirens
          ref: c042527238bd71421b792936bc48c3b815b90d6d
          path: legacy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused angular-model tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "jax[cpu]==0.4.34" \
            "numpy==1.26.4" \
            "scipy==1.12.0" \
            "pytest==8.3.4" \
            "ruff==0.15.20"
          python -m pip install --no-deps -e candidate

      - name: Definite-error lint
        working-directory: candidate
        run: |
          ruff check src/darksirens/population/angular.py src/darksirens/population/__init__.py tests/test_angular_basic.py tools/probe_angular_basic.py --select F,E9
          python -m compileall -q src/darksirens/population/angular.py src/darksirens/population/__init__.py tests/test_angular_basic.py tools/probe_angular_basic.py

      - name: Focused Phase 7F1 tests
        working-directory: candidate
        run: python -m pytest -q tests/test_angular_basic.py

      - name: Evaluate pinned legacy basic angular models
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/legacy" \
            python candidate/tools/probe_angular_basic.py \
              --mode legacy --out /tmp/angular-legacy.json

      - name: Evaluate reconstructed basic angular models
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/candidate/src" \
            python candidate/tools/probe_angular_basic.py \
              --mode candidate --out /tmp/angular-candidate.json

      - name: Require exact basic angular parity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          legacy = json.loads(Path('/tmp/angular-legacy.json').read_text())
          candidate = json.loads(Path('/tmp/angular-candidate.json').read_text())
          assert candidate == legacy, (legacy, candidate)
          print('Phase 7F1 isotropic/dipole parity is exact')
          PY

      - name: Show parity records
        run: |
          cat /tmp/angular-legacy.json
          cat /tmp/angular-candidate.json
