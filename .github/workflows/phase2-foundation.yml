name: phase2-foundation

on:
  push:
    branches: [rebuild/phase2-foundation]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAX_PLATFORMS: cpu
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          path: candidate

      - name: Check out pinned legacy reference
        uses: actions/checkout@v4
        with:
          repository: ignaciomagana/darksirens
          ref: c042527238bd71421b792936bc48c3b815b90d6d
          path: legacy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: candidate/pyproject.toml

      - name: Install validated CPU numerics
        run: |
          python -m pip install --upgrade pip
          python -m pip install "jax[cpu]==0.4.34" "numpy==1.26.4" "astropy==6.1.4" "pytest==8.3.4"
          python -m pip install --no-deps -e candidate

      - name: Candidate unit tests
        working-directory: candidate
        run: python -m pytest -q tests/test_foundation_imports.py tests/test_jax_runtime.py

      - name: Probe pinned legacy cosmology
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/legacy" python candidate/tools/probe_cosmology.py \
            --api legacy --legacy-root "$GITHUB_WORKSPACE/legacy" \
            --output /tmp/cosmology-legacy.json

      - name: Probe reconstructed cosmology
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/candidate/src" python candidate/tools/probe_cosmology.py \
            --api new --output /tmp/cosmology-new.json

      - name: Compare cosmology against pinned legacy
        run: |
          python candidate/tools/compare_cosmology_probe.py \
            /tmp/cosmology-legacy.json /tmp/cosmology-new.json --rtol 1e-12

      - name: Verify package root remains light after installation
        working-directory: /tmp
        run: |
          python - <<'PY'
          import sys
          import darksirens
          assert "jax" not in sys.modules
          print(darksirens.__version__, darksirens.__file__)
          PY
