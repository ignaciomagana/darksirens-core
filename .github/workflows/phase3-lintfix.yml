name: phase3-lintfix

on:
  push:
    branches: [rebuild/phase3-population]

permissions:
  contents: write

jobs:
  lintfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Remove only unused imports from migrated tests
        run: |
          set -euo pipefail
          python -m pip install "ruff==0.15.20"
          ruff check tests --select F401 --fix
          git diff --check
          git diff -- tests/test_component_spin_model.py tests/test_pairing_norm_grid.py tests/test_population_grammar.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_component_spin_model.py tests/test_pairing_norm_grid.py tests/test_population_grammar.py
          git diff --cached --quiet && exit 0
          git commit -m 'Remove unused imports from Phase 3 tests'
          git push origin HEAD:rebuild/phase3-population
