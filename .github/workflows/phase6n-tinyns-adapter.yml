name: phase6n-tinyns-adapter

on:
  push:
    branches: [rebuild/phase6-inference-io]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tinyns-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          path: candidate

      - name: Check out pinned legacy reference
        uses: actions/checkout@v4
        with:
          repository: ignaciomagana/darksirens
          ref: c042527238bd71421b792936bc48c3b815b90d6d
          path: legacy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependency-minimal test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.26.4" "pytest==8.3.4" "ruff==0.15.20"
          python -m pip install --no-deps -e candidate

      - name: Definite-error lint
        working-directory: candidate
        run: |
          ruff check src/darksirens/inference/tinyns_adapter.py tests/test_tinyns_adapter.py tools/probe_tinyns_adapter.py --select F,E9
          python -m compileall -q src/darksirens/inference/tinyns_adapter.py tests/test_tinyns_adapter.py tools/probe_tinyns_adapter.py

      - name: Verify backend imports stay lazy
        working-directory: candidate
        run: |
          python - <<'PY'
          import ast
          import sys
          from pathlib import Path

          path = Path("src/darksirens/inference/tinyns_adapter.py")
          tree = ast.parse(path.read_text())
          top_imports = []
          for node in tree.body:
              if isinstance(node, ast.Import):
                  top_imports.extend(alias.name for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  top_imports.append(node.module)
          assert not [n for n in top_imports if n == "jax" or n.startswith("jax.")]
          assert not [n for n in top_imports if n == "tinyns" or n.startswith("tinyns.")]

          import darksirens.inference.tinyns_adapter as adapter
          assert callable(adapter.run_tinyns)
          assert "jax" not in sys.modules
          assert "tinyns" not in sys.modules
          print("6N adapter keeps JAX/TinyNS lazy")
          PY

      - name: Focused Phase 6N tests
        working-directory: candidate
        run: python -m pytest -q tests/test_tinyns_adapter.py

      - name: Evaluate frozen legacy TinyNS adapter behavior
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/legacy" python candidate/tools/probe_tinyns_adapter.py \
            --implementation legacy \
            --legacy-root "$GITHUB_WORKSPACE/legacy" \
            --out /tmp/tinyns-adapter-legacy.json

      - name: Evaluate reconstructed TinyNS adapter behavior
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/candidate/src" python candidate/tools/probe_tinyns_adapter.py \
            --implementation candidate \
            --out /tmp/tinyns-adapter-candidate.json

      - name: Require exact Phase 6N parity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          legacy = json.loads(Path('/tmp/tinyns-adapter-legacy.json').read_text())
          candidate = json.loads(Path('/tmp/tinyns-adapter-candidate.json').read_text())
          if legacy != candidate:
              raise SystemExit(
                  "TinyNS adapter parity failure:\n"
                  f"legacy={legacy!r}\n"
                  f"candidate={candidate!r}"
              )
          print("Phase 6N frozen/new TinyNS adapter behavior is exact")
          PY
