[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "darksirens"
version = "0.1.0.dev0"
description = "Hierarchical population and cosmological inference with gravitational-wave sirens"
readme = "README.md"
# The pinned numpy 1.26.4 and scipy 1.12.0 ship no wheels for CPython 3.13+,
# where pip would fall back to source builds that fail; 3.11 is the validated
# interpreter and every pin has 3.12 wheels.
requires-python = ">=3.11,<3.13"
authors = [{name = "Ignacio Magana"}]
dependencies = [
  "jax==0.4.34",
  "jaxlib==0.4.34",
  "numpy==1.26.4",
  "scipy==1.12.0",
  "h5py==3.12.1",
  # TinyNS 1.0.0 (the v1.0.0 tag). Pinned by commit: the tag was moved once,
  # from 8851058 to this commit, before the release was uploaded.
  "tinyns @ git+https://github.com/ignaciomagana/tinyns.git@a3c77c46ef1d3e248d5b4ba3a558221e0bb817bd",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "ruff>=0.15",
  "astropy>=6.1,<7",
  "tinygp==0.3.0",
  "equinox==0.11.10",
]
gp = [
  "tinygp==0.3.0",
  "equinox==0.11.10",
]
dynesty = [
  "dynesty==2.1.4",
  # dynesty_diagnostics imports matplotlib lazily; dynesty itself does not ship
  # it. Pinned to the version the legacy-reference replay validates against.
  "matplotlib==3.9.2",
]
numpyro = [
  "numpyro==0.17.0",
]
gwcat = [
  # The chi_eff prior hook (darksirens.gw.samples.chi_eff_prior_logprob)
  # refuses a gwcat whose ChiEffPrior has no `support` (the -inf out-of-support
  # convention), so the pin must have it; the release job installs this extra
  # and calls the hook.
  "gwcat @ git+https://github.com/ignaciomagana/gwcat.git@3ba1dbf4116bb18f76c9103f79a914564d778182",
]

[project.urls]
Repository = "https://github.com/ignaciomagana/darksirens-core"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Slow tests (the multi-catalog mixture's end-to-end checks) run in their own
# CI job, slow-tests, with "pytest -m slow"; every other run deselects them.
addopts = "-ra -m 'not slow'"
markers = [
    "slow: long end-to-end checks, run by the slow-tests CI job (pytest -m slow)",
]
