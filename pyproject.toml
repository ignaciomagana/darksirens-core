[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "darksirens"
version = "0.1.0.dev0"
description = "Hierarchical population and cosmological inference with gravitational-wave sirens"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Ignacio Magana"}]
dependencies = [
  "jax==0.4.34",
  "jaxlib==0.4.34",
  "numpy==1.26.4",
  "scipy==1.12.0",
  "h5py==3.12.1",
  "tinyns @ git+https://github.com/ignaciomagana/tinyns.git@3f9e1b2537f32b59f17ee9ce68b2d725681a024c",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "ruff>=0.15",
  "astropy>=6.1,<7",
  "tinygp==0.3.0",
  "equinox==0.11.10",
]
gp = [
  "tinygp==0.3.0",
  "equinox==0.11.10",
]
dynesty = [
  "dynesty==2.1.4",
  # dynesty_diagnostics imports matplotlib lazily; dynesty itself does not ship
  # it. Pinned to the version the legacy-reference replay validates against.
  "matplotlib==3.9.2",
]
numpyro = [
  "numpyro==0.17.0",
]
gwcat = [
  "gwcat @ git+https://github.com/ignaciomagana/gwcat.git@3184bdb583f314d91ecae486436842ebe8e9f998",
]

[project.urls]
Repository = "https://github.com/ignaciomagana/darksirens-core"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
